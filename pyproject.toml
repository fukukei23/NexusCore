[project]
name = "nexuscore"
version = "8.2.0"
description = "Multi-agent AI development framework with multi-tier quality gates"
requires-python = ">=3.12"
license = "Apache-2.0"

[project.scripts]
nexus = "nexuscore.cli.app:main"

[project.entry-points."nexuscore.agents"]
# External agent plugins register here:
# my_agent = "my_package:MyAgent"

[project.entry-points."nexuscore.workflows"]
# External workflow plugins register here:
# my_workflow = "my_package:MyWorkflow"

[tool.black]
include = "\\.pyi?$"
exclude = """
/(
    \\.git
  | \\.venv
  | venv
  | dist
  | build
  | __pycache__
  | .nexus
  | chroma_db
  | vector_store
  | models
  | data
  | logs
  | tmp
  | src/sandbox_logs
)/
"""
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

# src-layout を明示する。既定は [".", "src"] なので値としては同じだが、
# 自動検出に頼らず固定する意図を明示する（"src" だけに絞ると main_cli 等
# ルート直下のモジュールが first-party から外れ、逆に違反が増える・実測7件）。
src = [".", "src"]
extend-exclude = [
  ".git",
  ".venv",
  "venv",
  "dist",
  "build",
  "__pycache__",
  ".nexus",
  "chroma_db",
  "vector_store",
  "models",
  "data",
  "logs",
  "tmp",
  "src/sandbox_logs",
]

[tool.ruff.lint]
select = [
  "E",  # pycodestyle
  "F",  # pyflakes
  "I",  # isort
  "B",  # bugbear
  "UP", # pyupgrade
]
ignore = [
  "E501",  # 行長は Black に任せる
  "UP040", # Python 3.12+ type文構文 (Python 3.11 非対応)
  "UP047", # Python 3.12+ 型パラメータ構文 (Python 3.11 非対応)
  "B008",  # FastAPI Depends() のデフォルト引数パターン (フレームワーク仕様)
  "E402",  # モジュールレベルimport順序 - sys.path設定後の意図的なimport
]

[tool.ruff.lint.isort]
# first-party を明示する（環境差の遮断）。
# 未指定だと ruff は「その環境で nexuscore を解決できるか」で first/third-party を推定するため、
#   ローカル（editable install 済みの .venv 内）: first-party
#   CI（ruff だけを入れた独立ジョブ）: third-party
# と判定が割れ、同一コマンド・同一ファイルでもローカル緑 / CI 赤になる。
# 2026-09-12 に実際に発生（src/nexuscore/archive/views_api_test.py の I001。
# 当該ファイルは無変更のまま、CI 側 ruff のバージョン更新で判定が変わった）。
known-first-party = ["nexuscore"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"


# mutation testing 対象（中核モジュール）: mutation_tester_agent + llm_router +
# authority_runner + run_lock + run_state_integrity
[tool.mutmut]
# mutants/ コピー内で依存モジュールを import できるよう src 全体をコピー
also_copy = ["src"]
paths_to_mutate = [
    "src/nexuscore/agents/mutation_tester_agent.py",
    "src/nexuscore/llm/llm_router.py",
    "src/nexuscore/orchestrator/authority_runner.py",
    "src/nexuscore/orchestrator/run_lock.py",
    "src/nexuscore/orchestrator/run_state_integrity.py",
]
tests_dir = [
    "tests/agents/test_mutation_tester_agent.py",
    "tests/llm/test_llm_router_classification.py",
    "tests/llm/test_llm_router_comprehensive.py",
    "tests/llm/test_llm_router_coverage_boost.py",
    "tests/llm/test_llm_router_helpers.py",
    "tests/llm/test_llm_router_selection.py",
    "tests/llm/test_llm_router_smoke.py",
    "tests/orchestrator/test_authority_runner.py",
    "tests/orchestrator/test_authority_runner_comprehensive.py",
    "tests/orchestrator/test_authority_runner_context_propagation.py",
    "tests/orchestrator/test_resume_lock_conflict.py",
    "tests/orchestrator/test_run_lock_refresh.py",
    "tests/orchestrator/test_run_lock_stale_reclaim.py",
    "tests/orchestrator/test_run_state_integrity.py",
    "-m", "not slow",
]

# ============================================================================
# Bandit セキュリティスキャン設定
# ============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/api/archive"]

# ============================================================================
# Bandit セキュリティスキャン設定
# ============================================================================
[tool.bandit]
# スキャン対象から除外するパス
exclude_dirs = [
  "tests/",
  ".venv/",
  "venv/",
  "build/",
  "dist/",
  ".nexus/",
  "chroma_db/",
  "vector_store/",
  "models/",
  "data/",
  "logs/",
  "tmp/",
  "src/sandbox_logs/",  # 修復ログ（72ファイル・AST parse失敗の原因・本来 src/ 配下ではない）
  "src/nexuscore/archive/",  # 非現用コード（Banditスキャン対象外）
  "src/nexuscore/api/archive/",  # 非現用コード（Banditスキャン対象外）
]

# スキップするテスト（必要に応じて調整）
# B101: assert_used - テストコード以外でのassert使用
# B601: paramiko_calls - パラメトライズされたシェル呼び出し
# 除外するテスト（明示的に無視）
# B404: import subprocess - subprocess自体のインポートは問題なし
# B603: subprocess_without_shell_equals_true - shell=Falseの場合は安全
skips = ["B101", "B404", "B603"]  # Phase 1〜: B101/B404/B603 をスキップ(B101=assert、B404=subprocess import、B603=subprocess call)
