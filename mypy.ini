[mypy]
# pyproject.toml requires-python >=3.12 に合わせる（2026-08-16・旧3.11表記是正）
python_version = 3.12
ignore_missing_imports = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
show_error_codes = True
pretty = True
exclude = (?x)(
    ^src/sandbox_logs/
    |^src/nexuscore/api/archive/
  )

# src 以下をメインターゲットに
[mypy-src.*]
disallow_untyped_defs = False

# tests は最初は無視（あとで段階的に厳しくしていく）
[mypy-tests.*]
ignore_errors = True

# Pydantic モデルは mypy-pydantic プラグインがないため call-arg を無視
# ※ モジュール解決は src. プリフィックス側（mypy src/ 実行時）に統一（2026-08-16・旧プリフィックス無しは未使用セクションだった）
[mypy-src.nexuscore.api.routes.github_webhook]
disable_error_code = call-arg

# SQLAlchemy declarative_base() の型エラーを無視
[mypy-database.*]
ignore_errors = True

# gradio の minor バージョン差でイベント属性(.click/.select等)の型定義が変わる
# （ローカル6.13実証 vs CI解決6.24でButton.click等がattr-defined化・2026-08-16実測）
# UI層は attr-defined のみ無効化（他エラーコードは検査継続）
[mypy-src.nexuscore.ui.*]
disable_error_code = attr-defined

