name: Secret Scan (gitleaks)

# 2026-08-29 A群(8): ci.yml から切り出し。
# push/PR 時は gitleaks-action が差分コミットのみ走査する実態があるため
# （push 実測: --log-opts で 2 commits のみ・「全履歴走査」との宣言乖離）、
# 週次 schedule で全履歴走査を別途実施する。
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  schedule:
    # 毎週月曜 03:23 UTC・全履歴走査（:00/:30 を避ける）
    - cron: "23 3 * * 1"
  workflow_dispatch: {}

jobs:
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git 履歴全体を走査するため

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
        # 2026-08-15 実効化: 導入(2026-08-05)以降の検出ゼロを確認済みのため警告モード解除
        # （検出でCI赤＝シークレット混入をマージブロック・C6監査CRITICAL#6対応）
