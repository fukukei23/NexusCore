version: '3.8'

services:
  # Redis (Celery ブローカー/バックエンド)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # DBマイグレーション one-shot ジョブ（C2・2026-08-05・Qiita六か条監査 CRITICAL #2）
  # webapp/celery-worker 起動前に DB スキーマを最新化する。restart:no で失敗時は手動介入。
  # ※ 責務分離: gunicorn 起動プロセスに migrate を混ぜない（DB一時不通の無限再起動ループ回避）
  # ※ 権限分離（推奨・将来課題）: アプリ実行ユーザー(DML)とマイグレーションユーザー(DDL)を分ける場合、
  #    このサービスの DATABASE_URI に DDL 権限を持つ MIGRATION_DATABASE_URI を渡す
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.webapp
    environment:
      - FLASK_APP=nexuscore.webapp:create_app
      - DATABASE_URI=postgresql://nexuscore:nexuscore@db:5432/nexuscore
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src
    command: ["flask", "db", "upgrade"]
    restart: "no"

  # Flask Web アプリケーション
  webapp:
    build:
      context: .
      dockerfile: Dockerfile.webapp  # 将来的に作成
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=nexuscore.webapp:create_app
      - FLASK_ENV=production
      - DATABASE_URI=postgresql://nexuscore:nexuscore@db:5432/nexuscore
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - NEXUS_USE_CELERY=1
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_REDIRECT_URI=${GITHUB_REDIRECT_URI}
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    command: gunicorn -w 4 -b 0.0.0.0:5000 "nexuscore.webapp:create_app()"

  # Celery Worker
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.webapp
    environment:
      - FLASK_APP=nexuscore.webapp:create_app
      - DATABASE_URI=postgresql://nexuscore:nexuscore@db:5432/nexuscore
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - NEXUS_USE_CELERY=1
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    command: celery -A nexuscore.webapp.celery_app.celery worker --loglevel=INFO --concurrency=4

  # PostgreSQL (本番環境用、開発環境では SQLite でも可)
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=nexuscore
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (fail-closed)}
      - POSTGRES_DB=nexuscore
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - backup_data:/backups:ro     # リストア用（db-backup と共有・読取専用）
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexuscore -d nexuscore"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # PostgreSQL 日次バックアップ sidecar（C1・2026-08-05・Qiita六か条監査 CRITICAL #1）
  # 24h ループで pg_dump + gzip・BACKUP_RETENTION_DAYS 日分保持・PITR は別タスク
  db-backup:
    image: postgres:15-alpine
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_USER=nexuscore
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (fail-closed)}
      - POSTGRES_DB=nexuscore
      - BACKUP_RETENTION_DAYS=7
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backup_data:/backups
      - ./scripts/backup-db.sh:/backup-db.sh:ro
    entrypoint: ["/bin/sh", "/backup-db.sh"]
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
  backup_data:

